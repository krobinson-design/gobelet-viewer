<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gobelet 3D Viewer</title>

  <!-- Google model-viewer web component (CDN) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
      --poster-color: transparent;
    }
  </style>
</head>
<body>

  <!--
    ================================================================
    INSTRUCTIONS
    ================================================================
    1. Placez ce fichier (index.html) et votre fichier GLB (gobelet.glb)
       dans le meme dossier.

    2. Deployez sur Netlify Drop ou GitHub Pages.

    3. Dans GlassGLBViewer.tsx, mettez votre URL:
         const GLB_VIEWER_URL = "https://votre-site.netlify.app";

    4. MESSAGES RECUS (parent -> iframe) :
         { type: "setColor",    color: "#FF5DFF", opacity: 0.85 }
         { type: "setTexture",  dataUrl: "data:image/png;base64,..." }
         { type: "setRotation", auto: true/false }
         { type: "recenter" }

       MESSAGES ENVOYES (iframe -> parent) :
         { type: "ready" }
         { type: "loaded" }
    ================================================================
  -->

  <model-viewer
    id="viewer"
    src="gobelet.glb"
    alt="Gobelet 3D personnalise"
    camera-controls
    disable-zoom
    interaction-prompt="none"
    shadow-intensity="0.6"
    shadow-softness="0.8"
    exposure="1.1"
    environment-image="neutral"
    camera-orbit="30deg 75deg 0.35m"
    min-camera-orbit="auto auto auto"
    max-camera-orbit="auto auto auto"
    style="background-color: transparent;"
  >
  </model-viewer>

  <script type="module">
    const viewer = document.getElementById('viewer');

    let currentColor = '#ffffff';
    let currentOpacity = 0.85;
    let autoRotate = false;
    let rotationAngle = 30;
    let animFrame = null;
    let textureDataUrl = null;

    // Notify parent
    function notifyReady() {
      window.parent.postMessage({ type: 'ready' }, '*');
    }

    // Wait for model to load
    viewer.addEventListener('load', () => {
      window.parent.postMessage({ type: 'loaded' }, '*');
      applyColor(currentColor, currentOpacity);
      if (textureDataUrl) applyTexture(textureDataUrl);
    });

    // Apply glass color
    function applyColor(hex, opacity) {
      const model = viewer.model;
      if (!model) return;

      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;

      for (const mat of model.materials) {
        const pbr = mat.pbrMetallicRoughness;
        if (pbr) {
          pbr.setBaseColorFactor([r, g, b, opacity]);
        }
      }
    }

    // Apply 2D canvas snapshot as texture on the model
    async function applyTexture(dataUrl) {
      const model = viewer.model;
      if (!model || !dataUrl) return;

      try {
        // Create texture from data URL
        const texture = await viewer.createTexture(dataUrl);

        // Apply to the first material's base color texture
        for (const mat of model.materials) {
          const pbr = mat.pbrMetallicRoughness;
          if (pbr) {
            pbr.baseColorTexture.setTexture(texture);
            // Reset base color factor to white so texture shows properly
            pbr.setBaseColorFactor([1, 1, 1, 1]);
          }
        }
      } catch (err) {
        console.warn('Failed to apply texture:', err);
        // Fallback: just set color
        applyColor(currentColor, currentOpacity);
      }
    }

    // Auto-rotation
    function startAutoRotate() {
      if (animFrame) return;
      const tick = () => {
        rotationAngle = (rotationAngle + 0.5) % 360;
        viewer.setAttribute('camera-orbit', `${rotationAngle}deg 75deg 0.35m`);
        animFrame = requestAnimationFrame(tick);
      };
      animFrame = requestAnimationFrame(tick);
    }

    function stopAutoRotate() {
      if (animFrame) {
        cancelAnimationFrame(animFrame);
        animFrame = null;
      }
    }

    function recenter() {
      rotationAngle = 30;
      viewer.setAttribute('camera-orbit', '30deg 75deg 0.35m');
    }

    // Listen for messages from parent
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || !data.type) return;

      switch (data.type) {
        case 'setColor':
          currentColor = data.color || '#ffffff';
          currentOpacity = data.opacity ?? currentOpacity;
          // Only apply color if no texture is set
          if (!textureDataUrl) {
            applyColor(currentColor, currentOpacity);
          }
          break;

        case 'setTexture':
          textureDataUrl = data.dataUrl || null;
          if (textureDataUrl) {
            applyTexture(textureDataUrl);
          } else {
            // Reset to color only
            applyColor(currentColor, currentOpacity);
          }
          break;

        case 'setOpacity':
          currentOpacity = data.opacity ?? 0.85;
          if (!textureDataUrl) {
            applyColor(currentColor, currentOpacity);
          }
          break;

        case 'setRotation':
          autoRotate = !!data.auto;
          if (autoRotate) startAutoRotate();
          else stopAutoRotate();
          break;

        case 'recenter':
          stopAutoRotate();
          autoRotate = false;
          recenter();
          break;

        default:
          break;
      }
    });

    notifyReady();
  </script>

</body>
</html>
