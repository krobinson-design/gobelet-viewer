<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gobelet 3D Viewer</title>

  <!-- Google model-viewer web component (CDN) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
      --poster-color: transparent;
    }

    /* Overlay canvas for the 2D design texture projected onto the gobelet */
    #design-overlay {
      display: none; /* Hidden canvas used to generate dynamic texture */
    }
  </style>
</head>
<body>

  <!--
    ================================================================
    INSTRUCTIONS
    ================================================================
    1. Placez ce fichier (index.html) et votre fichier GLB (gobelet.glb)
       dans le meme dossier.

    2. Deployez sur Netlify Drop (glisser-deposer le dossier sur
       https://app.netlify.com/drop) ou GitHub Pages.

    3. Dans votre app Figma Make, dans GlassGLBViewer.tsx,
       changez la constante :
         const GLB_VIEWER_URL = "https://votre-site.netlify.app";

    4. Le viewer communique via postMessage :

       MESSAGES RECUS (parent -> iframe) :
         { type: "setColor",    color: "#FF5DFF" }
         { type: "setRotation", auto: true/false }
         { type: "recenter" }
         { type: "setElements", elements: [...] }
         { type: "setOpacity",  opacity: 0.85 }

       MESSAGES ENVOYES (iframe -> parent) :
         { type: "ready" }
         { type: "loaded" }
    ================================================================
  -->

  <model-viewer
    id="viewer"
    src="gobelet.glb"
    alt="Gobelet 3D personnalise"
    camera-controls
    disable-zoom
    interaction-prompt="none"
    shadow-intensity="0.6"
    shadow-softness="0.8"
    exposure="1.1"
    environment-image="neutral"
    camera-orbit="30deg 75deg 0.35m"
    min-camera-orbit="auto auto auto"
    max-camera-orbit="auto auto auto"
    style="background-color: transparent;"
  >
  </model-viewer>

  <canvas id="design-overlay" width="1024" height="1024"></canvas>

  <script type="module">
    const viewer = document.getElementById('viewer');
    const canvas = document.getElementById('design-overlay');
    const ctx = canvas.getContext('2d');

    let currentColor = '#ffffff';
    let currentOpacity = 0.85;
    let currentElements = [];
    let autoRotate = false;
    let rotationAngle = 0;
    let animFrame = null;

    // ── Notify parent that viewer is ready ──
    function notifyReady() {
      window.parent.postMessage({ type: 'ready' }, '*');
    }

    // ── Wait for model to load ──
    viewer.addEventListener('load', () => {
      window.parent.postMessage({ type: 'loaded' }, '*');
      applyColor(currentColor, currentOpacity);
    });

    // ── Apply glass color by modifying the material ──
    function applyColor(hex, opacity) {
      const model = viewer.model;
      if (!model) return;

      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;

      // Try to color the main material
      for (const mat of model.materials) {
        const pbr = mat.pbrMetallicRoughness;
        if (pbr) {
          pbr.setBaseColorFactor([r, g, b, opacity]);
        }
      }
    }

    // ── Auto-rotation ──
    function startAutoRotate() {
      if (animFrame) return;
      const tick = () => {
        rotationAngle = (rotationAngle + 0.5) % 360;
        viewer.setAttribute('camera-orbit', `${rotationAngle}deg 75deg 0.35m`);
        animFrame = requestAnimationFrame(tick);
      };
      animFrame = requestAnimationFrame(tick);
    }

    function stopAutoRotate() {
      if (animFrame) {
        cancelAnimationFrame(animFrame);
        animFrame = null;
      }
    }

    // ── Recenter ──
    function recenter() {
      rotationAngle = 30;
      viewer.setAttribute('camera-orbit', '30deg 75deg 0.35m');
    }

    // ── Generate texture from 2D elements (for future use) ──
    function renderDesignTexture(elements) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const el of elements) {
        const x = (el.x / 100) * canvas.width;
        const y = (el.y / 100) * canvas.height;
        const w = (el.width / 100) * canvas.width;
        const h = (el.height / 100) * canvas.height;

        if (el.type === 'text') {
          ctx.save();
          ctx.translate(x + w / 2, y + h / 2);
          if (el.rotation) ctx.rotate((el.rotation * Math.PI) / 180);
          ctx.font = `${el.italic ? 'italic ' : ''}${el.bold ? 'bold ' : ''}${el.fontSize || 16}px ${el.fontFamily || 'sans-serif'}`;
          ctx.fillStyle = el.color || '#000000';
          ctx.globalAlpha = el.opacity ?? 1;
          ctx.textAlign = (el.textAlign || 'left');
          ctx.textBaseline = 'middle';
          ctx.fillText(el.content, 0, 0);
          ctx.restore();
        }

        if (el.type === 'image' && el.imageSrc) {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.src = el.imageSrc;
          img.onload = () => {
            ctx.save();
            ctx.globalAlpha = el.opacity ?? 1;
            ctx.translate(x + w / 2, y + h / 2);
            if (el.rotation) ctx.rotate((el.rotation * Math.PI) / 180);
            ctx.drawImage(img, -w / 2, -h / 2, w, h);
            ctx.restore();
            // Could apply as texture here if model supports it
          };
        }
      }
    }

    // ── Listen for messages from parent ──
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || !data.type) return;

      switch (data.type) {
        case 'setColor':
          currentColor = data.color || '#ffffff';
          currentOpacity = data.opacity ?? currentOpacity;
          applyColor(currentColor, currentOpacity);
          break;

        case 'setOpacity':
          currentOpacity = data.opacity ?? 0.85;
          applyColor(currentColor, currentOpacity);
          break;

        case 'setRotation':
          autoRotate = !!data.auto;
          if (autoRotate) startAutoRotate();
          else stopAutoRotate();
          break;

        case 'recenter':
          stopAutoRotate();
          autoRotate = false;
          recenter();
          break;

        case 'setElements':
          currentElements = data.elements || [];
          renderDesignTexture(currentElements);
          break;

        default:
          break;
      }
    });

    // Notify parent we're ready
    notifyReady();
  </script>

</body>
</html>
